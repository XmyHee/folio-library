server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        return 302 /folio-library/;
    }

    location /folio-library/ {
        try_files $uri $uri/ /folio-library/index.html;
    }

    location ~* ^/folio-library/.*\.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
        expires 7d;
    }

    location ~* ^/folio-library/(assets|fonts)/ {
        try_files $uri =404;
        expires 7d;
    }
}
